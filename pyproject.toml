[project]
name = "aurora-assistant"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite==0.21.0",
  "fastapi>=0.121.3,<1",
  "google-adk==2.9.1",
  "pydantic-settings==2.12.0",
  "sqlalchemy==2.0.44",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

